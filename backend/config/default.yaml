# Base config. Values are overridden by config/<APP_ENV>.yaml and then by
# environment variables (e.g. HTTP_ADDR, DATABASE_URL, JWT_SECRET).
app_env: local

http:
  addr: ":8080"
  web_origin: "http://localhost:5173"
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 10s

database:
  url: "postgres://tracker:tracker@localhost:5432/tracker?sslmode=disable"
  max_conns: 10
  min_conns: 1

jwt:
  secret: "change-me-in-production"
  access_ttl: 15m
  refresh_ttl: 720h

google_oauth:
  client_id: ""
  client_secret: ""
  redirect_url: "http://localhost:8080/api/v1/auth/google/callback"

log:
  level: "info"
  format: "text"
